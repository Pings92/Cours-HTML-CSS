<script>
var annuaire = {
    Riri : '06 66 66 66 66',
    Fifi : '07 77 77 77 77',
    Loulou : '08 88 88 88 88',
    Donald : '06 78 92 45 30',
    Picsou : '07 45 21 34 56',
    Yagami : '09 99 99 99 99',
    Ryûk : '10 00 00 00 00',
};

///console.log(annuaire.Patricia); // afficher le num de Patricia
// Recherche contact
function searchContact(){
    userDemand = prompt("De qui souhaitez-vous le numéro: (Patricia/David/Pierre/Paul/Jacques)");
    alert(`Le numéro de ${userDemand} est ${annuaire[userDemand]}`); 
}    
//console.log("Le numéro de " + userDemand + " est " + annuaire[userDemand]);

//Afficher la liste des contacts de l'annuaire
function showContact(){
    for(const property in annuaire){ //on peut mettre le nom qu'on veut à la place de property 
        alert(`${property}: ${annuaire[property]}`);
    }
    // Code de Jerem à essayer de comprendre
    // let liste = "Liste des contacts :\n";
    // for (let nom in annuaire) {
    //     liste += nom + " : " + annuaire[nom] + "\n";
    //     //liste + nom = liste;
    // }
}
//Ajout d'un nouvel élément dans l'objet => objet.prop = value
function addContact(){
    firstName = prompt("Qui souhaitez-vous ajouter?");
    phoneNumber = prompt("Quel est son numéro de téléphone?");
    annuaire[firstName] = phoneNumber;
    alert("Le " + annuaire[firstName] + " numéro de " + firstName + " a été ajouté à l'annuaire" )
}
//Suppression d'un contact
function deleteContact(){
    userToDelete = prompt("Quel contact souhaitez-vous supprimer de votre liste?");
    delete annuaire[userToDelete];
}
//Choix user pour faire une action
// "r" rechercher / "l" afficher la liste / "a" ajouter / "s" supprimer
let interrupt = ""
while (interrupt !== "q"){
    interrupt = prompt('Que souhaitez vous faire? ("q" pour stopper ) \n r : Rechercher un contact \n l : Afficher la liste des contacts \n a : Ajouter un contact \n s : Supprimer un contact')
    switch (interrupt){
        case "r":
            searchContact();
            break;
        case "l":
            showContact();
            break;
        case "a":
            addContact();
            break;
        case "s":
            deleteContact();
            break;
        default:
            alert("Désolé votre instruction n'existe pas. \n r : Rechercher un contact \n l : Afficher la liste des contacts \n a : Ajouter un contact \n s : Supprimer un contact \n q : quitter ")
    }
}
</script>
