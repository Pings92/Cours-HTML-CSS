<script>
//--------------TENTATIVE 2-----------------------------
function compare(choix1,choix2){
        if (choix1 == choix2){
            return "Match nul";
        }
        if (choix1 == "Pierre"){
            if (choix2 == "Ciseaux"){
                return "ordi";
            } else{
                return "joueur";
            }
        } else if (choix1 == "Ciseaux"){    
            if (choix2 == "Feuille"){
                return "ordi";
            } else {
                return "joueur";
            }
        } else if (choix1 == "Feuille"){
            if (choix2 == "Pierre"){
                return "ordi";
            } else {
                return "joueur";
            }
        }
    }

function chiFouMi(){
    let playerScore = 0;
    let computerScore = 0;

    for(i = 0; i < 3; i++){

    // Génération nombre ordi
        let computerChoice = Math.random() < 0.33 ? "Pierre" : Math.random() < 0.66 ? "Feuille" : "Ciseaux";

        console.log("Choix de l'ordi " + computerChoice)
        //Saisie nombre du joueur
        let playerChoice = prompt("Choisissez parmis Pierre, Feuille, Ciseaux");
        console.log("Saisie du joueur : " + playerChoice)
        let result = compare(computerChoice, playerChoice);

        if (result == "joueur"){
            playerScore++;
        }else{
            computerScore++;
        }
    }
        
        console.log("Score Joueur" + playerScore + " Score Ordi" + computerScore)

    if (playerScore > computerScore){
        alert("Le joueur a gagné : " + playerScore + "-" + computerScore)
    }else{
        alert("L'ordi a gagné : " + computerScore + "-" + playerScore)
    }
}   
  chiFouMi()
</script>
