<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=h1, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
    <h1>Contact</h1>
    <main>
      <section>
        <!--------LES Formulaires------->
        <p>Inscription</p>
        <form method="get" action="">
          <!--- il y a deux méthodes, get récupere les infos pour les afficher post elle envoie -->
          <p>
            <label for="prenom">Votre prénom:</label>
            <input
              type="text"
              name="prenom"
              placeholder="Votre prénom"
              size="30"
              maxlength="20"
            />
          </p>
          <!-- Checkbox -->
          <p>
            Cocher les aliments que vous préférez: <br />
            <input type="checkbox" name="frites" id="frites" />
            <label for="frites">Frites</label><br />
            <input type="checkbox" name="steak" id="steak" />
            <label for="steak">Steak</label><br />
            <input type="checkbox" name="panini" id="panini" />
            <label for="panini">Panini</label><br />
            <input type="checkbox" name="bokit" id="bokit" />
            <label for="bokit">Bokit</label><br />
          </p>
          <p>
            <!-- Radio-->
            <input type="radio" name="age" value="moins15" id="moins15" />
            <label for="moins15">Moins de 15 ans</label><br />
            <input
              type="radio"
              name="age"
              value="medium15-25"
              id="medium15-25"
            />
            <label for="medium15-25">15-25 ans</label><br />
            <input
              type="radio"
              name="age"
              value="medium25-40"
              id="medium25-40"
            />
            <label for="medium25-40">25-40</label><br />
            <input type="radio" name="age" value="plus40" id="plus40" />
            <label for="plus40">Plus de 40 ans</label><br />
          </p>
        </form>

        <form method="get" action="">
          <p>
            <label for="pays">De quel pays venez-vous?</label> <br />
            <select name="pays" id="pays">
              <option value="senegal">Sénégal</option>
              <option value="france">France</option>
              <option value="vietnam">Vietnam</option>
              <option value="venezuela" selected>Venezuela</option>
            </select>
          </p>
          <fieldset>
            <legend>Vos coordonées</legend>
            <label for="nom">Quel est votre nom?</label>
            <input type="text" name="nom" id="nom" /><br />
            <label for="prenom">Quel est votre prénom?</label>
            <input type="text" name="prenom" id="prenom" required/><br />
            <label for="email">Quel est votre email?</label>
            <input type="text" name="email" id="email" /><br />
          </fieldset>
          <input type="submit" value="Envoyer mon formulaire">
        
        </form>
      </section>
    </main>
  </body>
</html>
